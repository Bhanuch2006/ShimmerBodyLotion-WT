<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SharingIsCaring — Setup</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-0: #060612; --bg-1: #0c0c24; --bg-2: #13132e;
            --bg-card: rgba(255,255,255,0.035); --bg-card-h: rgba(255,255,255,0.06);
            --border: rgba(255,255,255,0.07); --border-h: rgba(255,255,255,0.14);
            --text: #e2e8f0; --text-m: #94a3b8; --text-d: #475569;
            --accent: #818cf8; --accent-rgb: 129,140,248;
            --accent2: #a78bfa;
            --grad: linear-gradient(135deg, #667eea, #764ba2);
            --grad2: linear-gradient(135deg, #4facfe, #00f2fe);
            --grad3: linear-gradient(135deg, #43e97b, #38f9d7);
            --grad4: linear-gradient(135deg, #f093fb, #f5576c);
            --ok: #34d399; --warn: #fbbf24; --err: #f87171;
            --shadow: 0 8px 32px rgba(0,0,0,0.5);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-0);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Background animation */
        body::before {
            content: '';
            position: fixed;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(ellipse at 30% 20%, rgba(102,126,234,0.08) 0%, transparent 50%),
                        radial-gradient(ellipse at 70% 80%, rgba(118,75,162,0.06) 0%, transparent 50%),
                        radial-gradient(ellipse at 50% 50%, rgba(129,140,248,0.03) 0%, transparent 70%);
            animation: bgFloat 20s ease-in-out infinite;
            z-index: 0;
        }
        @keyframes bgFloat {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(2%, -1%) rotate(1deg); }
            66% { transform: translate(-1%, 2%) rotate(-1deg); }
        }

        /* Title Bar */
        .tbar {
            height: 38px; background: var(--bg-1); border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 12px; -webkit-app-region: drag;
            position: relative; z-index: 10;
        }
        .tbar-brand { display: flex; align-items: center; gap: 8px; }
        .tbar-brand .ico { width: 20px; height: 20px; background: var(--grad); border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 11px; }
        .tbar-brand span { font-size: 12px; font-weight: 600; color: var(--text-m); letter-spacing: 0.5px; }
        .tbar-btns { display: flex; gap: 2px; -webkit-app-region: no-drag; }
        .tb { width: 36px; height: 28px; border: none; background: transparent; color: var(--text-m); font-size: 12px; cursor: pointer; border-radius: 6px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
        .tb:hover { background: rgba(var(--accent-rgb),0.15); color: var(--text); }
        .tb.x:hover { background: #e81123; color: white; }

        /* Main content */
        .setup-container {
            flex: 1; display: flex; align-items: center; justify-content: center;
            position: relative; z-index: 1;
        }
        .setup-inner {
            text-align: center; max-width: 700px; width: 100%; padding: 0 32px;
        }

        /* Logo */
        .logo-icon {
            width: 72px; height: 72px; background: var(--grad); border-radius: 18px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px; box-shadow: 0 8px 32px rgba(var(--accent-rgb),0.3);
            font-size: 36px;
            animation: logoPulse 3s ease-in-out infinite;
        }
        @keyframes logoPulse {
            0%,100% { box-shadow: 0 8px 32px rgba(var(--accent-rgb),0.3); }
            50% { box-shadow: 0 8px 48px rgba(var(--accent-rgb),0.5); }
        }
        .setup-title {
            font-size: 32px; font-weight: 800; margin-bottom: 8px;
            background: var(--grad); background-clip: text; -webkit-background-clip: text;
            -webkit-text-fill-color: transparent; color: transparent;
        }
        .setup-subtitle { font-size: 14px; color: var(--text-m); margin-bottom: 40px; }

        /* Mode cards */
        .mode-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }

        .mode-card {
            background: var(--bg-card); border: 2px solid var(--border); border-radius: 16px;
            padding: 28px 22px; cursor: pointer; transition: all 0.3s ease;
            position: relative; overflow: hidden;
        }
        .mode-card:hover {
            border-color: var(--border-h); transform: translateY(-4px);
            box-shadow: var(--shadow);
        }
        .mode-card.selected {
            border-color: var(--accent);
            box-shadow: 0 0 24px rgba(var(--accent-rgb),0.2), inset 0 0 24px rgba(var(--accent-rgb),0.03);
        }
        .mode-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
            background: var(--grad); opacity: 0; transition: opacity 0.3s;
        }
        .mode-card.selected::before { opacity: 1; }

        .mode-icon { font-size: 42px; margin-bottom: 14px; }
        .mode-title { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
        .mode-desc { font-size: 12px; color: var(--text-m); line-height: 1.6; }

        .mode-check {
            position: absolute; top: 14px; right: 14px; width: 24px; height: 24px;
            border-radius: 50%; border: 2px solid var(--border); display: flex;
            align-items: center; justify-content: center; transition: all 0.3s;
            font-size: 12px; color: transparent;
        }
        .mode-card.selected .mode-check {
            border-color: var(--accent); background: var(--accent); color: white;
        }

        /* IP Input Section */
        .ip-section {
            max-height: 0; overflow: hidden; transition: max-height 0.4s ease, opacity 0.3s ease;
            opacity: 0;
        }
        .ip-section.show { max-height: 200px; opacity: 1; }

        .ip-input-wrap {
            display: flex; gap: 10px; margin-top: 20px;
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 12px; padding: 6px; align-items: center;
        }
        .ip-input-wrap .prefix {
            font-size: 13px; color: var(--text-d); font-family: 'Consolas', monospace;
            padding-left: 12px; white-space: nowrap;
        }
        .ip-input {
            flex: 1; background: none; border: none; color: var(--text);
            font-family: 'Consolas', monospace; font-size: 15px; font-weight: 600;
            padding: 10px 4px; outline: none;
        }
        .ip-input::placeholder { color: var(--text-d); font-weight: 400; }

        /* Status message */
        .status-msg {
            font-size: 12px; margin-top: 10px; min-height: 20px;
            transition: all 0.3s;
        }
        .status-msg.error { color: var(--err); }
        .status-msg.success { color: var(--ok); }

        /* Continue button */
        .continue-btn {
            margin-top: 24px; padding: 14px 40px; border: none; border-radius: 12px;
            background: var(--grad); color: white; font-family: 'Inter', sans-serif;
            font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.3s;
            box-shadow: 0 4px 20px rgba(var(--accent-rgb),0.3);
            display: inline-flex; align-items: center; gap: 10px;
            letter-spacing: 0.3px;
        }
        .continue-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(var(--accent-rgb),0.4);
        }
        .continue-btn:disabled {
            opacity: 0.4; cursor: not-allowed; transform: none;
            box-shadow: 0 4px 20px rgba(var(--accent-rgb),0.1);
        }

        /* Loading spinner */
        .spinner {
            display: inline-block; width: 16px; height: 16px;
            border: 2px solid rgba(255,255,255,0.3); border-top-color: white;
            border-radius: 50%; animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Particle dots */
        .particle {
            position: fixed; width: 3px; height: 3px; border-radius: 50%;
            background: rgba(var(--accent-rgb), 0.3); pointer-events: none; z-index: 0;
        }
    </style>
</head>
<body>

<div class="tbar">
    <div class="tbar-brand"><div class="ico">⚡</div><span>SharingIsCaring</span></div>
    <div class="tbar-btns">
        <button class="tb" onclick="wctl('minimize')">─</button>
        <button class="tb" onclick="wctl('maximize')">□</button>
        <button class="tb x" onclick="wctl('close')">✕</button>
    </div>
</div>

<div class="setup-container">
    <div class="setup-inner">
        <div class="logo-icon">🔗</div>
        <h1 class="setup-title">SharingIsCaring</h1>
        <p class="setup-subtitle">Decentralized Compute Platform — Choose how to start</p>

        <div class="mode-cards">
            <div class="mode-card" id="mode-server" onclick="selectMode('server')">
                <div class="mode-check">✓</div>
                <div class="mode-icon">🖥️</div>
                <div class="mode-title">Host Server</div>
                <div class="mode-desc">Run the server on this laptop. The other device will connect to you.</div>
            </div>
            <div class="mode-card" id="mode-client" onclick="selectMode('client')">
                <div class="mode-check">✓</div>
                <div class="mode-icon">🔌</div>
                <div class="mode-title">Join Server</div>
                <div class="mode-desc">Connect to another laptop's server by entering its IP address.</div>
            </div>
        </div>

        <div class="ip-section" id="ip-section">
            <div class="ip-input-wrap">
                <span class="prefix">http://</span>
                <input type="text" class="ip-input" id="ip-input"
                       placeholder="192.168.x.x" autocomplete="off"
                       oninput="validateIP()">
                <span class="prefix">:3000</span>
            </div>
            <div class="status-msg" id="status-msg"></div>
        </div>

        <button class="continue-btn" id="continue-btn" disabled onclick="proceed()">
            🚀 Continue
        </button>
    </div>
</div>

<script>
let selectedMode = null;

// Decorative particles
for (let i = 0; i < 15; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.top = Math.random() * 100 + '%';
    p.style.opacity = Math.random() * 0.5 + 0.1;
    p.style.animation = `bgFloat ${10 + Math.random() * 20}s ease-in-out infinite`;
    p.style.animationDelay = -Math.random() * 20 + 's';
    document.body.appendChild(p);
}

function selectMode(mode) {
    selectedMode = mode;
    document.querySelectorAll('.mode-card').forEach(c => c.classList.remove('selected'));
    document.getElementById('mode-' + mode).classList.add('selected');

    const ipSection = document.getElementById('ip-section');
    const btn = document.getElementById('continue-btn');
    const statusMsg = document.getElementById('status-msg');
    statusMsg.textContent = '';
    statusMsg.className = 'status-msg';

    if (mode === 'client') {
        ipSection.classList.add('show');
        document.getElementById('ip-input').focus();
        validateIP();
    } else {
        ipSection.classList.remove('show');
        btn.disabled = false;
        btn.innerHTML = '🖥️ Start as Server';
    }
}

function validateIP() {
    const input = document.getElementById('ip-input').value.trim();
    const btn = document.getElementById('continue-btn');
    const statusMsg = document.getElementById('status-msg');

    // Basic IP validation
    const ipPattern = /^(\d{1,3}\.){3}\d{1,3}$/;
    if (!input) {
        btn.disabled = true;
        statusMsg.textContent = '';
        btn.innerHTML = '🔌 Connect';
        return;
    }
    if (!ipPattern.test(input)) {
        btn.disabled = true;
        statusMsg.textContent = '⚠️ Enter a valid IP address (e.g. 192.168.1.100)';
        statusMsg.className = 'status-msg error';
        return;
    }

    const parts = input.split('.').map(Number);
    if (parts.some(p => p > 255)) {
        btn.disabled = true;
        statusMsg.textContent = '⚠️ Each octet must be 0-255';
        statusMsg.className = 'status-msg error';
        return;
    }

    btn.disabled = false;
    btn.innerHTML = '🔌 Connect to ' + input;
    statusMsg.textContent = '✅ Valid IP address';
    statusMsg.className = 'status-msg success';
}

// Enter key to proceed
document.getElementById('ip-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !document.getElementById('continue-btn').disabled) {
        proceed();
    }
});

async function proceed() {
    const btn = document.getElementById('continue-btn');
    const statusMsg = document.getElementById('status-msg');
    btn.disabled = true;

    if (selectedMode === 'server') {
        btn.innerHTML = '<span class="spinner"></span> Starting server...';
        if (window.electronAPI) {
            window.electronAPI.selectMode('server', null);
        }
    } else if (selectedMode === 'client') {
        const ip = document.getElementById('ip-input').value.trim();
        btn.innerHTML = '<span class="spinner"></span> Connecting to ' + ip + '...';
        statusMsg.textContent = '⏳ Checking if server is reachable...';
        statusMsg.className = 'status-msg';

        if (window.electronAPI) {
            window.electronAPI.selectMode('client', ip);
        }
    }
}

function wctl(a) {
    if (window.electronAPI) window.electronAPI[a]();
    else if (a === 'close') window.close();
}
</script>
</body>
</html>
